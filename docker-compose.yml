services:
  postgres:
    image: postgres:16-alpine
    container_name: bantay-kalikasan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menro
      POSTGRES_PASSWORD: menro_password
      POSTGRES_DB: bantay_kalikasan
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menro -d bantay_kalikasan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bantay-kalikasan-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://menro:menro_password@postgres:5432/bantay_kalikasan
      JWT_SECRET: bantay-kalikasan-menro-rizal-2026
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: bantay-kalikasan-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
